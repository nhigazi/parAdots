<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consultant Workboard</title>
<!--
  parAdots Workboard — kollaboratives Prozess- & Kanban-Board.
  Geteilter Zustand in Supabase, geschuetzt durch einen Zugangskey (DB-seitig via RPC geprueft).
  KONFIG: siehe CONFIG-Block unten. Das SQL-Schema liegt in supabase_workboard.sql.
-->
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1b2430; --muted:#6b7686;
    --line:#e2e7ef; --accent:#3b66e0; --accent-ink:#17306b; --accent-soft:#e8efff;
    --shadow:0 1px 3px rgba(20,30,50,.08),0 6px 20px rgba(20,30,50,.06);
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f141c; --panel:#161d28; --ink:#e7ecf3; --muted:#93a0b2;
      --line:#273040; --accent:#6b8cff; --accent-ink:#c7d4ff; --accent-soft:#1d2740;
      --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  .wordmark{font-weight:700;letter-spacing:.2px;font-size:16px;white-space:nowrap}
  .wordmark b{color:var(--accent)}
  button{cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:8px;
         padding:7px 11px;color:var(--ink);transition:.12s}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{filter:brightness(1.05);color:#fff}
  button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
  button.ghost:hover{color:var(--accent);background:var(--accent-soft)}
  button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  select,input,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

  /* ---- Gate ---- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:linear-gradient(160deg,var(--bg),var(--accent-soft));z-index:50}
  #gate .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        box-shadow:var(--shadow);padding:30px 28px;width:min(92vw,380px);text-align:center}
  #gate .logo{font-size:26px;font-weight:800;margin-bottom:4px}
  #gate .logo b{color:var(--accent)}
  #gate p{color:var(--muted);margin:.2em 0 1.2em}
  #gate input{width:100%;text-align:center;margin-bottom:12px;padding:10px}
  #gate .row{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;margin-top:10px}
  #gateErr{color:#d64545;min-height:1.2em;font-size:13px;margin-top:8px}

  /* ---- App shell ---- */
  #app{display:none;flex-direction:column;height:100%}
  .topbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);
          border-bottom:1px solid var(--line);flex-wrap:wrap}
  .topbar .sp{flex:1}
  .toolbar{display:flex;align-items:center;gap:7px;padding:8px 14px;background:var(--panel);
           border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:50px}
  .toolbar .hint{color:var(--muted);font-size:12.5px;margin-left:6px}
  .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
  .dot{width:9px;height:9px;border-radius:50%;background:#b7c0ce;display:inline-block}
  .dot.ok{background:#2fa360}.dot.sync{background:var(--accent)}.dot.err{background:#d64545}
  #palette{display:flex;flex-wrap:wrap;gap:5px;max-width:232px;align-items:center}
  .swatch{width:16px;height:16px;border-radius:5px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .swatch:hover{transform:scale(1.15)}
  .swatch.sel{box-shadow:0 0 0 2px var(--accent)}
  main{flex:1;position:relative;overflow:hidden}

  /* ---- Canvas ---- */
  #canvasWrap{position:absolute;inset:0;overflow:hidden;background:
     radial-gradient(circle at 1px 1px, rgba(120,130,150,.22) 1px, transparent 0) 0 0/22px 22px, var(--bg)}
  #canvas{width:100%;height:100%;display:block;touch-action:none;user-select:none}
  .node-shape{pointer-events:none}
  .node-hit{cursor:grab;pointer-events:all;fill:transparent}
  .node.dragging .node-hit{cursor:grabbing}
  .node.sel .node-shape{stroke:var(--accent);stroke-width:3}
  .rhandle{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;pointer-events:all}
  #fontVal{font-size:12.5px}
  #shapePanel{position:absolute;left:12px;top:12px;z-index:6;width:170px;background:var(--panel);
     border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);user-select:none}
  #shapePanelHead{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);
     cursor:move;font-size:12.5px;font-weight:600;color:var(--muted)}
  #shapePanelHead .grip{margin-left:auto;letter-spacing:-2px;color:var(--line);font-size:16px}
  #shapeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;max-height:62vh;overflow:auto}
  .shapeBtn{display:flex;align-items:center;justify-content:center;padding:4px;border:1px solid var(--line);
     border-radius:8px;background:var(--bg);cursor:pointer}
  .shapeBtn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .shapeBtn svg{display:block;width:40px;height:26px;pointer-events:none}
  .node foreignObject div{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
        text-align:center;padding:6px 8px;font-size:13px;line-height:1.25;overflow:hidden;word-break:break-word;pointer-events:none}
  .edge-path{fill:none;stroke:var(--muted);stroke-width:2}
  .edge.sel .edge-path{stroke:var(--accent);stroke-width:3}
  .edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
  .edge-label{font-size:12px;fill:var(--ink)}
  #nodeEditor{position:absolute;display:none;border:2px solid var(--accent);border-radius:8px;
     padding:6px;resize:none;z-index:6;box-shadow:var(--shadow);text-align:center}
  .zoombar{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:4}
  .zoombar button{width:38px;height:34px;box-shadow:var(--shadow)}
  .connect-badge{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;
     background:var(--accent);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);display:none}

  /* ---- Kanban ---- */
  #kanban{position:absolute;inset:0;display:flex;gap:14px;padding:16px;overflow-x:auto}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
       width:300px;min-width:260px;display:flex;flex-direction:column;max-height:100%}
  .col.drop{outline:2px dashed var(--accent);outline-offset:-4px}
  .col h3{margin:0;padding:12px 14px;font-size:13.5px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .col h3 .count{color:var(--muted);font-weight:500}
  .col .cards{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:9px}
  .kcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;cursor:pointer;box-shadow:var(--shadow)}
  .kcard:hover{border-color:var(--accent)}
  .kcard .t{font-weight:600;margin-bottom:3px}
  .kcard .d{color:var(--muted);font-size:12.5px;white-space:pre-wrap;max-height:4.2em;overflow:hidden}
  .kcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .chip.assignee{background:#eef1f4;color:#2b3440}
  .col .add{margin:8px 10px 12px;border-style:dashed;color:var(--muted)}

  /* ---- Modal ---- */
  .overlay{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;z-index:40}
  .overlay.show{display:flex}
  .modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);width:min(94vw,460px);padding:20px 22px}
  .modal h3{margin:0 0 14px}
  .modal label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px}
  .modal input,.modal textarea,.modal select{width:100%}
  .modal textarea{min-height:84px;resize:vertical}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .modal .actions .sp{flex:1}
  .radio{display:flex;gap:8px;margin-top:6px}
  .radio label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;
     padding:8px 12px;cursor:pointer;color:var(--ink);margin:0;flex:1}
  .radio input{width:auto}
  .radio label.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>

<!-- ============ Zugangs-Gate ============ -->
<div id="gate">
  <div class="card">
    <div class="logo">Consultant</div>
    <div class="wordmark" style="color:var(--muted);font-weight:600" data-i="wb">Workboard</div>
    <p data-i="gateHint">Bitte Zugangskey eingeben.</p>
    <input id="gateKey" type="password" autocomplete="off" data-ph="gatePh">
    <button class="primary" id="gateGo" style="width:100%;padding:10px" data-i="enter">Öffnen</button>
    <div id="gateErr"></div>
    <div class="row"><label style="display:flex;gap:6px;align-items:center;cursor:pointer">
      <input type="checkbox" id="gateRemember" checked style="width:auto"> <span data-i="remember">Auf diesem Gerät merken</span></label></div>
  </div>
</div>

<!-- ============ App ============ -->
<div id="app">
  <div class="topbar">
    <span class="wordmark">Consultant <span style="color:var(--muted);font-weight:600" data-i="wb">Workboard</span></span>
    <span class="sep"></span>
    <select id="boardSel" title="Board"></select>
    <button class="ghost" id="newBoard" data-i="newBoard">+ Board</button>
    <button class="ghost" id="renameBoard" title="" data-i="rename">Umbenennen</button>
    <button class="ghost" id="delBoard" title="" data-i="delete">Löschen</button>
    <span class="sp"></span>
    <span class="dot" id="syncDot" title="Sync"></span>
    <button class="ghost" id="langBtn">DE / EN</button>
    <button class="ghost" id="lockBtn" data-i="lock">Sperren</button>
  </div>

  <!-- Prozess-Toolbar -->
  <div class="toolbar" id="procTools">
    <button id="connectBtn" data-i="connect">↳ Verbinden</button>
    <button id="delSel" data-i="delSel">Löschen</button>
    <span class="sep"></span>
    <span id="palette"></span>
    <span class="sep"></span>
    <button id="fmtBold" data-title="bold"><b>F</b></button>
    <button id="fmtItalic" data-title="italic"><i>K</i></button>
    <button id="fmtUnderline" data-title="underline"><u>U</u></button>
    <button id="fmtStrike" data-title="strike"><s>S</s></button>
    <button id="fmtUpper" data-title="upper">AA</button>
    <button id="fontDec" data-title="fontSmaller">A−</button>
    <span id="fontVal" style="min-width:26px;text-align:center;color:var(--muted)">14</span>
    <button id="fontInc" data-title="fontBigger">A+</button>
    <span class="hint" data-i="procHint"></span>
  </div>

  <!-- Kanban-Toolbar -->
  <div class="toolbar" id="kanTools" style="display:none">
    <span class="hint" data-i="kanHint">Karte anklicken zum Bearbeiten · ziehen zwischen Spalten</span>
  </div>

  <main>
    <!-- Prozess-Canvas -->
    <div id="canvasWrap" style="display:none">
      <div id="shapePanel">
        <div id="shapePanelHead">▦ <span data-i="shapesTitle">Formen</span><span class="grip">⠿</span></div>
        <div id="shapeGrid"></div>
      </div>
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"></path>
          </marker>
          <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"></path>
          </marker>
        </defs>
        <g id="scene">
          <g id="edges"></g>
          <g id="nodes"></g>
          <g id="handles"></g>
        </g>
      </svg>
      <textarea id="nodeEditor" rows="2"></textarea>
      <div class="connect-badge" id="connectBadge" data-i="connectBadge">Verbinden: Start-Element anklicken…</div>
      <div class="zoombar">
        <button id="zIn">＋</button>
        <button id="zOut">－</button>
        <button id="zFit" title="" data-i="fit">⤢</button>
      </div>
    </div>

    <!-- Kanban -->
    <div id="kanban" style="display:none"></div>
  </main>
</div>

<!-- Karte bearbeiten -->
<div class="overlay" id="cardOverlay">
  <div class="modal">
    <h3 id="cardModalTitle" data-i="editCard">Karte bearbeiten</h3>
    <label data-i="fTitle">Titel</label>
    <input id="cTitle">
    <label data-i="fDesc">Beschreibung</label>
    <textarea id="cDesc"></textarea>
    <div style="display:flex;gap:12px">
      <div style="flex:1"><label data-i="fAssignee">Zuständig</label><input id="cAssignee"></div>
      <div style="flex:1"><label data-i="fLabel">Label</label><input id="cLabel"></div>
    </div>
    <div class="actions">
      <button id="cDelete" style="color:#d64545" data-i="delete">Löschen</button>
      <span class="sp"></span>
      <button id="cCancel" data-i="cancel">Abbrechen</button>
      <button class="primary" id="cSave" data-i="save">Speichern</button>
    </div>
  </div>
</div>

<!-- Neues Board -->
<div class="overlay" id="boardOverlay">
  <div class="modal">
    <h3 data-i="newBoardT">Neues Board</h3>
    <label data-i="fName">Name</label>
    <input id="bName" placeholder="z. B. Kermi Re-Engagement Prozess">
    <label data-i="fType">Typ</label>
    <div class="radio" id="bType">
      <label class="sel"><input type="radio" name="btype" value="process" checked> <span data-i="typeProcess">Prozess-Canvas</span></label>
      <label><input type="radio" name="btype" value="kanban"> <span data-i="typeKanban">Kanban</span></label>
    </div>
    <div class="actions">
      <span class="sp"></span>
      <button id="bCancel" data-i="cancel">Abbrechen</button>
      <button class="primary" id="bCreate" data-i="create">Anlegen</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIG  — dein Supabase-Projekt. Der publishable Key ist oeffentlich
   unbedenklich; die Daten schuetzt der Zugangskey (DB-seitig via RPC).
   ============================================================ */
const CONFIG = {
  url: "https://sajbfjnsyghzjmaadykh.supabase.co",
  publishableKey: "sb_publishable_thLUmKMS42OembdXHFchrw_DOt2J4W6"
};

/* ---------------- i18n ---------------- */
const I18N = {
  de:{wb:"Workboard",gateHint:"Bitte Zugangskey eingeben.",gatePh:"Zugangskey",enter:"Öffnen",
      remember:"Auf diesem Gerät merken",newBoard:"+ Board",rename:"Umbenennen",delete:"Löschen",
      lock:"Sperren",shRect:"▭ Prozess",shRounded:"▢ Aktion",shDecision:"◇ Entscheidung",
      shStart:"⬭ Start/Ende",shNote:"▤ Notiz",connect:"↳ Verbinden",delSel:"Löschen",
      procHint:"Form anklicken = hinzufügen · Doppelklick = umbenennen · Box ziehen = verschieben · Anfasser ziehen = Größe · Mausrad = Zoom",
      kanHint:"Karte anklicken zum Bearbeiten · ziehen zwischen Spalten",fit:"Einpassen",
      connectBadge:"Verbinden: Start-Element anklicken…",connectBadge2:"Verbinden: Ziel-Element anklicken (Esc = Abbruch)",
      editCard:"Karte bearbeiten",fTitle:"Titel",fDesc:"Beschreibung",fAssignee:"Zuständig",fLabel:"Label",
      cancel:"Abbrechen",save:"Speichern",create:"Anlegen",newBoardT:"Neues Board",fName:"Name",fType:"Typ",

let LANG = lsGet("wb_lang") || "de";
function t(k){ return (I18N[LANG] && I18N[LANG][k]) || (I18N.de[k]) || k; }
function applyI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i]").forEach(el=>{ el.textContent = t(el.getAttribute("data-i")); });
  document.querySelectorAll("[data-ph]").forEach(el=>{ el.placeholder = t(el.getAttribute("data-ph")); });
  document.querySelectorAll("[data-title]").forEach(el=>{ el.title = t(el.getAttribute("data-title")); });
  buildShapePanel();
  document.getElementById("langBtn").textContent = LANG==="de" ? "DE / EN" : "EN / DE";
  if(boardType==="kanban") renderKanban();
}

/* ---------------- localStorage (sicher gekapselt) ---------------- */
function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function lsDel(k){ try{localStorage.removeItem(k);}catch(e){} }

/* ---------------- Farben & Formen ---------------- */
const COLORS = {
  red:    {fill:"#fdeaea",stroke:"#dc3f3f",text:"#7a1f1f"},
  coral:  {fill:"#fdeee6",stroke:"#e5663a",text:"#7a3415"},

  cyan:   {fill:"#e2f5f9",stroke:"#1197b5",text:"#0b4a59"},
  sky:    {fill:"#e6f1fd",stroke:"#2b86e0",text:"#11406b"},
  blue:   {fill:"#e8efff",stroke:"#3b66e0",text:"#17306b"},
  indigo: {fill:"#ebeafe",stroke:"#5b57e0",text:"#2a2891"},
  violet: {fill:"#f1e9fe",stroke:"#8b4fe0",text:"#4a2191"},
  purple: {fill:"#f6e9fb",stroke:"#a93fc9",text:"#5a1f6e"},
  magenta:{fill:"#fce7f4",stroke:"#cc3f94",text:"#701f54"},
  pink:   {fill:"#fde8ec",stroke:"#e0456a",text:"#7a1f38"},
  brown:  {fill:"#f3ece4",stroke:"#9c6b3f",text:"#513620"},
  slate:  {fill:"#eceff3",stroke:"#5f7088",text:"#2b3a4d"},
  gray:   {fill:"#eef1f4",stroke:"#7a8694",text:"#2b3440"}
};
const COLOR_ORDER = ["red","coral","orange","amber","yellow","lime","green","emerald","teal","cyan","sky","blue","indigo","violet","purple","magenta","pink","brown","slate","gray"];
const SHAPES=[

let KEY = null;
let boards = [];
let boardId = null;

let state = { nodes:{}, edges:{}, cards:{} };
let selColor = "blue";
let selection = null;          // {kind:'node'|'edge', id}
let connectMode = false, connectSource = null;

let editingCardId = null;

/* ============================================================
   Supabase-RPC
   ============================================================ */
async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args);
  if(error){ throw error; }
  return data;
}
function setDot(cls){ const d=document.getElementById("syncDot"); d.className="dot "+(cls||""); }

/* ============================================================
   Auth / Gate
   ============================================================ */
async function tryKey(key){
  sb = window.supabase.createClient(CONFIG.url, CONFIG.publishableKey, { auth:{persistSession:false} });
  KEY = key;
  await rpc("wb_boards_list", { p_key:key });   // wirft bei falschem Key
}
async function doGate(){
  const key = document.getElementById("gateKey").value.trim();
  const err = document.getElementById("gateErr");
  err.textContent = "";
  if(!key) return;
  try{
    setDot("sync");
    await tryKey(key);
    if(document.getElementById("gateRemember").checked) lsSet("wb_key", key);
    document.getElementById("gate").style.display="none";
    document.getElementById("app").style.display="flex";
    setDot("ok");
    await initApp();
  }catch(e){
    setDot("err");
    err.textContent = t("badKey");
    lsDel("wb_key");
  }
}

/* ============================================================
   Boards
   ============================================================ */
async function initApp(){
  await loadBoards();
  let want = lsGet("wb_board");
  if(!want || !boards.find(b=>b.id===want)) want = boards[0] ? boards[0].id : null;
  if(want){ await selectBoard(want); }
  else { renderEmpty(); }
  startPolling();
}
async function loadBoards(){
  boards = await rpc("wb_boards_list", { p_key:KEY }) || [];
  const sel = document.getElementById("boardSel");
  sel.innerHTML = "";
  boards.forEach(b=>{
    const o=document.createElement("option");
    o.value=b.id; o.textContent=(b.type==="kanban"?"▦ ":"◇ ")+b.name;
    sel.appendChild(o);
  });
  if(boardId) sel.value = boardId;
}
async function selectBoard(id){
  boardId = id; lsSet("wb_board", id);
  const b = boards.find(x=>x.id===id); boardType = b ? b.type : "process";
  document.getElementById("boardSel").value = id;
  document.getElementById("procTools").style.display = boardType==="process"?"flex":"none";
  document.getElementById("kanTools").style.display  = boardType==="kanban"?"flex":"none";
  document.getElementById("canvasWrap").style.display= boardType==="process"?"block":"none";
  document.getElementById("kanban").style.display    = boardType==="kanban"?"flex":"none";
  selection=null; connectMode=false; connectSource=null; updateConnectUI();
  await reload(true);
}
function renderEmpty(){
  document.getElementById("canvasWrap").style.display="none";
  document.getElementById("kanban").style.display="none";
  document.getElementById("procTools").style.display="none";
  document.getElementById("kanTools").style.display="none";
}

/* ============================================================
   Laden / Sync
   ============================================================ */
async function reload(fit){
  if(!boardId) return;
  const data = await rpc("wb_load", { p_key:KEY, p_board:boardId });
  applyServer(data);
  lastSig = JSON.stringify(data);
  if(fit && boardType==="process") fitView();
}
function applyServer(data){
  state = { nodes:{}, edges:{}, cards:{} };
  (data.nodes||[]).forEach(n=> state.nodes[n.id]=n);
  (data.edges||[]).forEach(e=> state.edges[e.id]=e);
  (data.cards||[]).forEach(c=> state.cards[c.id]=c);
  if(selection && selection.kind==='node' && !state.nodes[selection.id]) selection=null;
  if(boardType==="process"){ renderCanvas(); updateFmtUI(); } else renderKanban();
}
let pollTimer=null;
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async ()=>{
    if(!boardId || busy) return;
    if(Date.now()-lastWrite < 1500) return;
    try{
      setDot("sync");
      const data = await rpc("wb_load", { p_key:KEY, p_board:boardId });
      const sig = JSON.stringify(data);
      if(sig!==lastSig){ lastSig=sig; applyServer(data); }
      setDot("ok");
    }catch(e){ setDot("err"); }
  }, 4000);
}
function touch(){ lastWrite = Date.now(); }

/* ============================================================
   Prozess-Canvas  —  Rendering
   ============================================================ */
function sceneTransform(){ document.getElementById("scene").setAttribute("transform",
  `translate(${view.tx} ${view.ty}) scale(${view.scale})`); }

function renderCanvas(){
  sceneTransform();
  const gN=document.getElementById("nodes"), gE=document.getElementById("edges");
  gN.innerHTML=""; gE.innerHTML="";
  Object.values(state.edges).forEach(e=> gE.appendChild(edgeEl(e)));
  Object.values(state.nodes).forEach(n=> gN.appendChild(nodeEl(n)));
  renderHandles();
}
function nodeCenter(n){ return { x:n.x+n.w/2, y:n.y+n.h/2 }; }
function borderPoint(n, toward){
  const c=nodeCenter(n); let dx=toward.x-c.x, dy=toward.y-c.y;
  if(dx===0&&dy===0) return c;
  const hw=n.w/2, hh=n.h/2;
  const tt=1/Math.max(Math.abs(dx)/hw, Math.abs(dy)/hh);
  return { x:c.x+dx*tt, y:c.y+dy*tt };
}
function edgeGeometry(e){
  const a=state.nodes[e.source_id], b=state.nodes[e.target_id];
  if(!a||!b) return null;
  const p1=borderPoint(a,nodeCenter(b)), p2=borderPoint(b,nodeCenter(a));
  // Wie viele Verbindungen bestehen zwischen diesem Paar (ungerichtet)?
  const pairId=[e.source_id,e.target_id].slice().sort().join("|");
  const peers=Object.values(state.edges).filter(x=>[x.source_id,x.target_id].slice().sort().join("|")===pairId);
  if(peers.length<=1){
    return { d:`M ${p1.x} ${p1.y} L ${p2.x} ${p2.y}`, mid:{x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2} };
  }
  // Mehrere Kanten -> biege jede nach rechts IHRER Richtung => Gegenrichtungen trennen sich
  const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy)||1;
  const rx=dy/len, ry=-dx/len;
  const idx=Math.max(0,peers.findIndex(x=>x.id===e.id));
  const off=24+20*Math.floor(idx/2);
  const cx=(p1.x+p2.x)/2 + rx*off, cy=(p1.y+p2.y)/2 + ry*off;
  const mid={x:0.25*p1.x+0.5*cx+0.25*p2.x, y:0.25*p1.y+0.5*cy+0.25*p2.y};
  return { d:`M ${p1.x} ${p1.y} Q ${cx} ${cy} ${p2.x} ${p2.y}`, mid };
}
function edgeEl(e){
  const g=document.createElementNS(SVGNS,"g");
  g.setAttribute("class","edge"+(isSel('edge',e.id)?" sel":"")); g.dataset.id=e.id;
  const geo=edgeGeometry(e); if(!geo) return g;
  const hit=document.createElementNS(SVGNS,"path"); hit.setAttribute("class","edge-hit"); hit.setAttribute("d",geo.d);
  hit.setAttribute("fill","none"); hit.setAttribute("stroke","transparent"); hit.setAttribute("stroke-width","14");
  const path=document.createElementNS(SVGNS,"path"); path.setAttribute("class","edge-path"); path.setAttribute("d",geo.d);
  path.setAttribute("fill","none"); path.setAttribute("stroke","#6b7686"); path.setAttribute("stroke-width","2");
  path.setAttribute("marker-end", isSel('edge',e.id)?"url(#arrowSel)":"url(#arrow)");
  g.appendChild(hit); g.appendChild(path);
  if(e.label){
    const tw=e.label.length*6.6+8;
    const bg=document.createElementNS(SVGNS,"rect");
    bg.setAttribute("x",geo.mid.x-tw/2); bg.setAttribute("y",geo.mid.y-10); bg.setAttribute("width",tw); bg.setAttribute("height",18);
    bg.setAttribute("rx",5); bg.setAttribute("fill","#ffffff"); bg.setAttribute("stroke","#d7dce5");
    const tx=document.createElementNS(SVGNS,"text"); tx.setAttribute("class","edge-label");
    tx.setAttribute("fill","#1b2430"); tx.setAttribute("font-family",TEXT_FONT); tx.setAttribute("font-size","12");
    tx.setAttribute("x",geo.mid.x); tx.setAttribute("y",geo.mid.y+4); tx.setAttribute("text-anchor","middle"); tx.textContent=e.label;
    g.appendChild(bg); g.appendChild(tx);
  }
  hit.addEventListener("click",ev=>{ ev.stopPropagation(); select('edge',e.id); });
  hit.addEventListener("dblclick",ev=>{ ev.stopPropagation(); editEdgeLabel(e); });
  return g;
}
function mkEl(tag,a){ const e=document.createElementNS(SVGNS,tag); for(const k in a) e.setAttribute(k,a[k]); return e; }
function shapeEl(n){
  const col=COLORS[n.color]||COLORS.blue;
  const isNote=n.shape==="note";
  const fill=isNote?"#fff9db":col.fill, stroke=isNote?"#e3c35a":col.stroke, sw=isNote?1.5:2;
  const W=n.w, H=n.h;
  const P=o=>Object.assign({fill,stroke,"stroke-width":sw,"class":"node-shape"},o);
  switch(n.shape){
    case "ellipse": case "circle":
      return mkEl("ellipse",P({cx:W/2,cy:H/2,rx:W/2,ry:H/2}));
    case "decision":
      return mkEl("polygon",P({points:`${W/2},0 ${W},${H/2} ${W/2},${H} 0,${H/2}`}));
    case "parallelogram":{ const s=Math.min(W*0.25,30);
      return mkEl("polygon",P({points:`${s},0 ${W},0 ${W-s},${H} 0,${H}`})); }
    case "hexagon":{ const s=Math.min(W*0.25,30);
      return mkEl("polygon",P({points:`${s},0 ${W-s},0 ${W},${H/2} ${W-s},${H} ${s},${H} 0,${H/2}`})); }
    case "triangle":
      return mkEl("polygon",P({points:`${W/2},0 ${W},${H} 0,${H}`}));
    case "chevron":{ const s=Math.min(W*0.3,26);
      return mkEl("polygon",P({points:`0,0 ${W-s},0 ${W},${H/2} ${W-s},${H} 0,${H} ${s},${H/2}`})); }
    case "card":{ const s=Math.min(W*0.22,22);
      return mkEl("polygon",P({points:`${s},0 ${W},0 ${W},${H} 0,${H} 0,${s}`})); }
    case "document":{ const wv=Math.min(H*0.2,16);
      return mkEl("path",P({d:`M0,0 L${W},0 L${W},${H-wv} Q ${W*0.75},${H+wv} ${W*0.5},${H-wv} T 0,${H-wv} Z`})); }
    case "cylinder":{ const g=mkEl("g",{"class":"node-shape"}); const ry=Math.min(H*0.16,14);
      g.appendChild(mkEl("path",{d:`M0,${ry} A ${W/2} ${ry} 0 0 1 ${W},${ry} L ${W},${H-ry} A ${W/2} ${ry} 0 0 1 0,${H-ry} Z`,fill,stroke,"stroke-width":sw}));
      g.appendChild(mkEl("path",{d:`M0,${ry} A ${W/2} ${ry} 0 0 0 ${W},${ry}`,fill:"none",stroke,"stroke-width":sw}));
      return g; }
    case "process2":{ const g=mkEl("g",{"class":"node-shape"}); const b=Math.min(W*0.12,14);
      g.appendChild(mkEl("rect",{x:0,y:0,width:W,height:H,rx:3,fill,stroke,"stroke-width":sw}));
      g.appendChild(mkEl("line",{x1:b,y1:0,x2:b,y2:H,stroke,"stroke-width":sw}));
      g.appendChild(mkEl("line",{x1:W-b,y1:0,x2:W-b,y2:H,stroke,"stroke-width":sw}));
      return g; }
    case "cloud":{ const w=W,h=H;
      const d=`M ${0.25*w} ${0.92*h} C ${0.03*w} ${0.92*h} ${0.03*w} ${0.58*h} ${0.2*w} ${0.54*h} `
             +`C ${0.1*w} ${0.26*h} ${0.42*w} ${0.16*h} ${0.52*w} ${0.34*h} `
             +`C ${0.62*w} ${0.12*h} ${0.95*w} ${0.18*h} ${0.84*w} ${0.5*h} `
             +`C ${1.02*w} ${0.56*h} ${0.97*w} ${0.92*h} ${0.75*w} ${0.92*h} Z`;
      return mkEl("path",P({d})); }
    case "rounded": return mkEl("rect",P({width:W,height:H,rx:14}));
    case "startend": return mkEl("rect",P({width:W,height:H,rx:H/2}));
    default: return mkEl("rect",P({width:W,height:H,rx:4})); // rect & note
  }
}
function shapeIcon(shape){
  const svg=mkEl("svg",{viewBox:"0 0 44 28"});
  const el=shapeEl({w:38,h:22,shape,color:"slate",x:0,y:0});
  el.setAttribute("transform","translate(3 3)");
  svg.appendChild(el); return svg;
}
function buildShapePanel(){
  const grid=document.getElementById("shapeGrid"); if(!grid) return; grid.innerHTML="";
  SHAPES.forEach(sh=>{
    const b=document.createElement("button"); b.className="shapeBtn"; b.title=(LANG==="de"?sh.de:sh.en);
    b.appendChild(shapeIcon(sh.s));
    b.addEventListener("click",()=>addNode(sh.s));
    grid.appendChild(b);
  });
}
/* Text als echtes SVG (Formatierung + Export) */
function wrapLines(str, maxW, fontCss){
  _mctx.font=fontCss; const out=[];
  (str.split("\n")).forEach(para=>{
    const words=para.split(/\s+/).filter(Boolean);
    if(!words.length){ out.push(""); return; }
    let line=words[0];
    for(let i=1;i<words.length;i++){
      const test=line+" "+words[i];
      if(_mctx.measureText(test).width<=maxW) line=test; else { out.push(line); line=words[i]; }
    }
    out.push(line);
  });
  return out;
}
function textEl(n){
  let str=(n.text||""); if(!str) return null;
  if(n.upper) str=str.toUpperCase();
  const fs=n.fontsize||14, pad=8;
  const fontCss=`${n.italic?'italic':'normal'} ${n.bold?'bold':'normal'} ${fs}px ${TEXT_FONT}`;
  const lines=wrapLines(str, Math.max(10,n.w-2*pad), fontCss);
  const lh=fs*1.25;
  const t=document.createElementNS(SVGNS,"text");
  t.setAttribute("text-anchor","middle"); t.setAttribute("font-family",TEXT_FONT); t.setAttribute("font-size",fs);
  t.setAttribute("font-weight", n.bold?"bold":"normal"); t.setAttribute("font-style", n.italic?"italic":"normal");
  const deco=[]; if(n.underline)deco.push("underline"); if(n.strike)deco.push("line-through");
  if(deco.length) t.setAttribute("text-decoration", deco.join(" "));
  t.setAttribute("fill", n.shape==="note"?"#5a4a10":(COLORS[n.color]||COLORS.blue).text);
  t.style.pointerEvents="none";
  const startY=n.h/2 - (lines.length-1)*lh/2;
  lines.forEach((ln,i)=>{
    const ts=document.createElementNS(SVGNS,"tspan");
    ts.setAttribute("x",n.w/2); ts.setAttribute("y",startY+i*lh); ts.setAttribute("dominant-baseline","middle");
    ts.textContent=ln; t.appendChild(ts);
  });
  return t;
}
function nodeEl(n){
  const g=document.createElementNS(SVGNS,"g");
  g.setAttribute("class","node"+(isSel('node',n.id)?" sel":"")); g.dataset.id=n.id;
  g.setAttribute("transform",`translate(${n.x} ${n.y})`);
  g.appendChild(shapeEl(n));
  const label=textEl(n); if(label) g.appendChild(label);
  // Transparenter Hit-Layer ganz oben -> ganze Box ist Greifflaeche + Hand-Cursor
  const hit=document.createElementNS(SVGNS,"rect");
  hit.setAttribute("class","node-hit"); hit.setAttribute("fill","transparent");
  hit.setAttribute("x",0); hit.setAttribute("y",0);
  hit.setAttribute("width",n.w); hit.setAttribute("height",n.h); hit.setAttribute("rx",8);
  g.appendChild(hit);
  attachNodeHandlers(g,hit,n);
  return g;
}

/* ---------------- Canvas-Interaktion ---------------- */
function screenToScene(clientX,clientY){
  const r=document.getElementById("canvasWrap").getBoundingClientRect();
  return { x:(clientX-r.left-view.tx)/view.scale, y:(clientY-r.top-view.ty)/view.scale };
}
function attachNodeHandlers(g,hit,n){
  let moved=false, start=null, orig=null, lastDown=0;
  hit.addEventListener("pointerdown",ev=>{
    if(ev.button!==0) return;
    if(connectMode){ ev.stopPropagation(); handleConnectClick(n); return; }
    const now=Date.now();
    if(now-lastDown<400){ lastDown=0; ev.stopPropagation(); ev.preventDefault(); editNodeText(n); return; } // eigener Doppelklick (Safari-sicher)
    lastDown=now;
    ev.stopPropagation(); ev.preventDefault();
    select('node',n.id);                 // nur Auswahl-Klasse, KEIN Neuzeichnen
    busy=true; moved=false;
    start=screenToScene(ev.clientX,ev.clientY); orig={x:n.x,y:n.y};
    g.classList.add("dragging");
    try{ hit.setPointerCapture(ev.pointerId); }catch(e){}
    const move=(e2)=>{
      const p=screenToScene(e2.clientX,e2.clientY);
      const nx=orig.x+(p.x-start.x), ny=orig.y+(p.y-start.y);
      if(Math.abs(nx-orig.x)+Math.abs(ny-orig.y)>2) moved=true;
      n.x=nx; n.y=ny; g.setAttribute("transform",`translate(${nx} ${ny})`);
      updateEdgesFor(n.id); repositionHandles(n);
    };
    const up=()=>{
      hit.removeEventListener("pointermove",move); hit.removeEventListener("pointerup",up);
      g.classList.remove("dragging"); busy=false;
      if(moved) saveNode(n);
    };
    hit.addEventListener("pointermove",move);
    hit.addEventListener("pointerup",up);
  });
  hit.addEventListener("dblclick",ev=>{ ev.stopPropagation(); if(!connectMode) editNodeText(n); });
}
function updateEdgesFor(nodeId){
  document.querySelectorAll("#edges .edge").forEach(g=>{
    const e=state.edges[g.dataset.id]; if(!e) return;
    if(e.source_id===nodeId||e.target_id===nodeId){
      const fresh=edgeEl(e); g.replaceWith(fresh);
    }
  });
}

/* ---- Groesse aendern (Anfasser an Ecken/Raendern) ---- */
const MINW=24, MINH=16, HANDLE=10;
const HANDLE_DIRS=["nw","n","ne","e","se","s","sw","w"];
const HCURSOR={nw:"nwse-resize",se:"nwse-resize",ne:"nesw-resize",sw:"nesw-resize",n:"ns-resize",s:"ns-resize",e:"ew-resize",w:"ew-resize"};
function handleCenter(dir,n){
  const L=n.x,R=n.x+n.w,T=n.y,B=n.y+n.h,MX=n.x+n.w/2,MY=n.y+n.h/2;
  return ({nw:[L,T],n:[MX,T],ne:[R,T],e:[R,MY],se:[R,B],s:[MX,B],sw:[L,B],w:[L,MY]})[dir];
}
function placeHandle(h,dir,n,s){
  const c=handleCenter(dir,n);
  h.setAttribute("width",s); h.setAttribute("height",s);
  h.setAttribute("x",c[0]-s/2); h.setAttribute("y",c[1]-s/2); h.setAttribute("rx",2);
}
function renderHandles(){
  const gH=document.getElementById("handles"); if(!gH) return;
  gH.innerHTML="";
  if(boardType!=="process"||!selection||selection.kind!=="node") return;
  const n=state.nodes[selection.id]; if(!n) return;
  const s=HANDLE/view.scale;
  HANDLE_DIRS.forEach(dir=>{
    const h=document.createElementNS(SVGNS,"rect");
    h.setAttribute("class","rhandle"); h.dataset.dir=dir; h.style.cursor=HCURSOR[dir];
    placeHandle(h,dir,n,s); attachResize(h,dir,n); gH.appendChild(h);
  });
}
function repositionHandles(n){
  const s=HANDLE/view.scale;
  document.querySelectorAll("#handles .rhandle").forEach(h=> placeHandle(h,h.dataset.dir,n,s));
}
function rebuildNode(n){
  const old=document.querySelector('#nodes .node[data-id="'+n.id+'"]');
  if(old) old.replaceWith(nodeEl(n));
}
function applyResize(dir,orig,ddx,ddy,n){
  let x=orig.x,y=orig.y,w=orig.w,h=orig.h;
  if(dir.indexOf("e")>=0) w=orig.w+ddx;
  if(dir.indexOf("s")>=0) h=orig.h+ddy;
  if(dir.indexOf("w")>=0){ w=orig.w-ddx; x=orig.x+ddx; }
  if(dir.indexOf("n")>=0){ h=orig.h-ddy; y=orig.y+ddy; }
  if(w<MINW){ if(dir.indexOf("w")>=0) x=orig.x+orig.w-MINW; w=MINW; }
  if(h<MINH){ if(dir.indexOf("n")>=0) y=orig.y+orig.h-MINH; h=MINH; }
  n.x=x; n.y=y; n.w=w; n.h=h;
}
function attachResize(h,dir,n){
  h.addEventListener("pointerdown",ev=>{
    if(ev.button!==0) return;
    ev.stopPropagation(); ev.preventDefault();
    busy=true;
    const orig={x:n.x,y:n.y,w:n.w,h:n.h};
    const start=screenToScene(ev.clientX,ev.clientY);
    try{ h.setPointerCapture(ev.pointerId); }catch(e){}
    const move=(e2)=>{
      const p=screenToScene(e2.clientX,e2.clientY);
      applyResize(dir,orig,p.x-start.x,p.y-start.y,n);
      rebuildNode(n); repositionHandles(n); updateEdgesFor(n.id);
    };
    const up=()=>{
      h.removeEventListener("pointermove",move); h.removeEventListener("pointerup",up);
      busy=false; saveNode(n);
    };
    h.addEventListener("pointermove",move); h.addEventListener("pointerup",up);
  });
}
function isSel(kind,id){ return selection && selection.kind===kind && selection.id===id; }
function refreshSelection(){
  document.querySelectorAll("#nodes .node").forEach(g=> g.classList.toggle("sel", isSel('node',g.dataset.id)));
  document.querySelectorAll("#edges .edge").forEach(g=>{
    const s=isSel('edge',g.dataset.id); g.classList.toggle("sel",s);
    const p=g.querySelector(".edge-path"); if(p) p.setAttribute("marker-end", s?"url(#arrowSel)":"url(#arrow)");
  });
  renderHandles(); updateFmtUI();
}
function select(kind,id){ selection={kind,id}; if(boardType==="process") refreshSelection(); }
function clearSelection(){ selection=null; if(boardType==="process") refreshSelection(); }

/* Pan + Zoom + Hintergrund-Klick */
(function canvasBg(){
  const wrap=document.getElementById("canvasWrap");
  let panning=false,sx,sy,otx,oty;
  wrap.addEventListener("pointerdown",ev=>{
    if(ev.target.closest(".node")||ev.target.closest(".edge")) return;
    if(connectMode){ if(connectSource){ connectSource=null; updateConnectUI(); } return; }
    panning=true; busy=true; sx=ev.clientX; sy=ev.clientY; otx=view.tx; oty=view.ty;
    wrap.setPointerCapture(ev.pointerId); clearSelection();
  });
  wrap.addEventListener("pointermove",ev=>{
    if(!panning)return; view.tx=otx+(ev.clientX-sx); view.ty=oty+(ev.clientY-sy); sceneTransform();
  });
  wrap.addEventListener("pointerup",ev=>{ panning=false; busy=false; });
  wrap.addEventListener("wheel",ev=>{
    ev.preventDefault();
    const r=wrap.getBoundingClientRect(); const cx=ev.clientX-r.left, cy=ev.clientY-r.top;
    const factor=ev.deltaY<0?1.1:1/1.1;
    const ns=Math.min(4,Math.max(0.05,view.scale*factor));
    const wx=(cx-view.tx)/view.scale, wy=(cy-view.ty)/view.scale;
    view.scale=ns; view.tx=cx-wx*ns; view.ty=cy-wy*ns; sceneTransform(); renderHandles();
  },{passive:false});
})();
function fitView(){
  const ns=Object.values(state.nodes); const wrap=document.getElementById("canvasWrap").getBoundingClientRect();
  if(!ns.length){ view={tx:80,ty:60,scale:1}; sceneTransform(); renderHandles(); return; }
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  ns.forEach(n=>{ minx=Math.min(minx,n.x);miny=Math.min(miny,n.y);maxx=Math.max(maxx,n.x+n.w);maxy=Math.max(maxy,n.y+n.h);});
  const bw=maxx-minx||1,bh=maxy-miny||1;
  const s=Math.min(wrap.width/(bw+120), wrap.height/(bh+120), 1.6);
  view.scale=Math.max(0.2,s);
  view.tx=(wrap.width-bw*view.scale)/2 - minx*view.scale;
  view.ty=(wrap.height-bh*view.scale)/2 - miny*view.scale;
  sceneTransform(); renderHandles();
}

/* Knoten hinzufuegen */
function addNode(shape){
  const wrap=document.getElementById("canvasWrap").getBoundingClientRect();
  const center=screenToScene(wrap.left+wrap.width/2, wrap.top+wrap.height/2);
  const SZ={decision:[150,90],startend:[170,56],circle:[110,110],ellipse:[160,100],
            triangle:[150,120],cylinder:[130,110],cloud:[180,110],hexagon:[170,80],
            parallelogram:[180,70],chevron:[170,70]};
  const [w,h]=SZ[shape]||[170,70];
  const nx=Math.round(center.x-w/2+(Math.random()*40-20)), ny=Math.round(center.y-h/2+(Math.random()*40-20));
  const n={ id:crypto.randomUUID(), board_id:boardId, x:nx, y:ny, w, h, text:"", color:selColor, shape, fontsize:14 };
  state.nodes[n.id]=n; selection={kind:'node',id:n.id}; renderCanvas(); updateFmtUI(); saveNode(n);
  setTimeout(()=>editNodeText(n),30);
}
async function saveNode(n){
  touch();
  try{ await rpc("wb_node_upsert",{p_key:KEY,p_board:boardId,p:{
    id:n.id,x:n.x,y:n.y,w:n.w,h:n.h,text:n.text,color:n.color,shape:n.shape,
    bold:!!n.bold,italic:!!n.italic,underline:!!n.underline,strike:!!n.strike,upper:!!n.upper,fontsize:n.fontsize||14}}); }catch(e){ setDot("err"); }
}
async function deleteNode(id){
  delete state.nodes[id];
  Object.values(state.edges).forEach(e=>{ if(e.source_id===id||e.target_id===id) delete state.edges[e.id]; });
  selection=null; renderCanvas(); touch();
  try{ await rpc("wb_node_delete",{p_key:KEY,p_board:boardId,p_id:id}); }catch(e){ setDot("err"); }
}
async function saveEdge(e){
  touch();
  try{ await rpc("wb_edge_upsert",{p_key:KEY,p_board:boardId,p:{
    id:e.id,source_id:e.source_id,target_id:e.target_id,label:e.label||""}}); }catch(err){ setDot("err"); }
}
async function deleteEdge(id){
  delete state.edges[id]; selection=null; renderCanvas(); touch();
  try{ await rpc("wb_edge_delete",{p_key:KEY,p_board:boardId,p_id:id}); }catch(e){ setDot("err"); }
}

/* Text bearbeiten (Knoten) */
function editNodeText(n){
  const ed=document.getElementById("nodeEditor");
  if(ed.style.display==="block") return;   // schon offen -> nicht doppelt
  busy=true;
  const col=COLORS[n.color]||COLORS.blue;
  ed.style.display="block";
  ed.style.left=(view.tx+n.x*view.scale)+"px";
  ed.style.top =(view.ty+n.y*view.scale)+"px";
  ed.style.width=(n.w*view.scale)+"px";
  ed.style.height=(n.h*view.scale)+"px";
  ed.style.color=(n.shape==="note")?"#5a4a10":col.text;
  ed.value=n.text||""; ed.focus(); ed.select();
  function commit(){
    ed.removeEventListener("blur",commit); ed.removeEventListener("keydown",key);
    ed.style.display="none"; busy=false;
    const v=ed.value;
    if(v!==n.text){ n.text=v; renderCanvas(); saveNode(n); }
  }
  function key(ev){
    if(ev.key==="Enter"&&!ev.shiftKey){ ev.preventDefault(); ed.blur(); }
    if(ev.key==="Escape"){ ed.value=n.text||""; ed.blur(); }
  }
  ed.addEventListener("blur",commit); ed.addEventListener("keydown",key);
}
function editEdgeLabel(e){
  const v=window.prompt(t("fLabel")+":", e.label||"");
  if(v===null) return; e.label=v; renderCanvas(); saveEdge(e);
}

/* Verbinden */
function updateConnectUI(){
  const btn=document.getElementById("connectBtn"), badge=document.getElementById("connectBadge");
  btn.classList.toggle("active",connectMode);
  badge.style.display=connectMode?"block":"none";
  badge.textContent=connectSource? t("connectBadge2") : t("connectBadge");
  document.getElementById("canvas").style.cursor=connectMode?"crosshair":"";
}
function toggleConnect(){ connectMode=!connectMode; connectSource=null; updateConnectUI(); }
function handleConnectClick(n){
  if(!connectSource){ connectSource=n.id; updateConnectUI(); select('node',n.id); return; }
  if(connectSource===n.id){ connectSource=null; updateConnectUI(); return; }  // Abwahl
  const e={ id:crypto.randomUUID(), board_id:boardId, source_id:connectSource, target_id:n.id, label:"" };
  state.edges[e.id]=e;
  connectSource=null;               // Verbinden-Modus bleibt AN -> mehrere/gegenlaeufige Verbindungen
  updateConnectUI(); renderCanvas(); saveEdge(e);
}

/* Palette */
function buildPalette(){
  const p=document.getElementById("palette"); p.innerHTML="";
  COLOR_ORDER.forEach(c=>{
    const s=document.createElement("span"); s.className="swatch"+(c===selColor?" sel":"");
    s.style.background=COLORS[c].stroke; s.title=c;
    s.addEventListener("click",()=>{
      selColor=c; buildPalette();
      if(selection&&selection.kind==='node'){ const n=state.nodes[selection.id]; if(n){ n.color=c; renderCanvas(); saveNode(n);} }
    });
    p.appendChild(s);
  });
}

/* ---- Textformatierung (wirkt auf die gewaehlte Box) ---- */
function fmtToggle(prop){
  if(!selection||selection.kind!=='node') return;
  const n=state.nodes[selection.id]; if(!n) return;
  n[prop]=!n[prop]; rebuildNode(n); updateFmtUI(); saveNode(n);
}
function fontDelta(d){
  if(!selection||selection.kind!=='node') return;
  const n=state.nodes[selection.id]; if(!n) return;
  n.fontsize=Math.min(96,Math.max(8,(n.fontsize||14)+d)); rebuildNode(n); updateFmtUI(); saveNode(n);
}
function updateFmtUI(){
  const n=(selection&&selection.kind==='node')?state.nodes[selection.id]:null;
  [["fmtBold","bold"],["fmtItalic","italic"],["fmtUnderline","underline"],["fmtStrike","strike"],["fmtUpper","upper"]].forEach(([id,prop])=>{
    const b=document.getElementById(id); if(b) b.classList.toggle("active",!!(n&&n[prop]));
  });
  const fv=document.getElementById("fontVal"); if(fv) fv.textContent=n?(n.fontsize||14):"–";
}

/* ============================================================
   Kanban
   ============================================================ */
const KCOLS=[["backlog","colBacklog"],["inprogress","colInprogress"],["review","colReview"],["done","colDone"]];
function renderKanban(){
  const root=document.getElementById("kanban"); root.innerHTML="";
  KCOLS.forEach(([key,i18n])=>{
    const col=document.createElement("div"); col.className="col"; col.dataset.col=key;
    const list=Object.values(state.cards).filter(c=>c.col===key).sort((a,b)=>a.pos-b.pos);
    const h=document.createElement("h3");
    h.innerHTML=`<span>${t(i18n)}</span><span class="count">${list.length}</span>`;
    col.appendChild(h);
    const cards=document.createElement("div"); cards.className="cards";
    list.forEach(c=> cards.appendChild(kcardEl(c)));
    col.appendChild(cards);
    const add=document.createElement("button"); add.className="add"; add.textContent=t("addCard");
    add.addEventListener("click",()=> newCard(key));
    col.appendChild(add);
    // Drop-Ziele
    col.addEventListener("dragover",ev=>{ ev.preventDefault(); col.classList.add("drop"); });
    col.addEventListener("dragleave",()=> col.classList.remove("drop"));
    col.addEventListener("drop",ev=>{
      ev.preventDefault(); col.classList.remove("drop");
      const id=ev.dataTransfer.getData("text/plain"); moveCard(id,key);
    });
    root.appendChild(col);
  });
}
function kcardEl(c){
  const el=document.createElement("div"); el.className="kcard"; el.draggable=true; el.dataset.id=c.id;
  let meta="";
  if(c.assignee) meta+=`<span class="chip assignee">${esc(c.assignee)}</span>`;
  if(c.label) meta+=`<span class="chip">${esc(c.label)}</span>`;
  el.innerHTML=`<div class="t">${esc(c.title)||"—"}</div>`+
               (c.description?`<div class="d">${esc(c.description)}</div>`:"")+
               (meta?`<div class="meta">${meta}</div>`:"");
  el.addEventListener("click",()=> openCard(c.id));
  el.addEventListener("dragstart",ev=>{ busy=true; ev.dataTransfer.setData("text/plain",c.id); });
  el.addEventListener("dragend",()=>{ busy=false; });
  return el;
}
function newCard(col){
  const c={ id:crypto.randomUUID(), board_id:boardId, col, title:"", description:"", assignee:"", label:"",
            pos:Date.now() };
  state.cards[c.id]=c; openCard(c.id);
}
async function moveCard(id,col){
  const c=state.cards[id]; if(!c) return; c.col=col; c.pos=Date.now(); renderKanban(); touch();
  await saveCard(c);
}
async function saveCard(c){
  touch();
  try{ await rpc("wb_card_upsert",{p_key:KEY,p_board:boardId,p:{
    id:c.id,col:c.col,title:c.title,description:c.description,assignee:c.assignee,label:c.label,pos:c.pos}}); }
  catch(e){ setDot("err"); }
}
async function deleteCard(id){
  delete state.cards[id]; renderKanban(); touch();
  try{ await rpc("wb_card_delete",{p_key:KEY,p_board:boardId,p_id:id}); }catch(e){ setDot("err"); }
}
function openCard(id){
  const c=state.cards[id]; if(!c) return; editingCardId=id;
  document.getElementById("cTitle").value=c.title||"";
  document.getElementById("cDesc").value=c.description||"";
  document.getElementById("cAssignee").value=c.assignee||"";
  document.getElementById("cLabel").value=c.label||"";
  document.getElementById("cardOverlay").classList.add("show");
  document.getElementById("cTitle").focus();
}
function closeCard(){ document.getElementById("cardOverlay").classList.remove("show"); editingCardId=null; }

/* ============================================================
   Board-Verwaltung
   ============================================================ */
function openNewBoard(){ document.getElementById("bName").value=""; document.getElementById("boardOverlay").classList.add("show"); document.getElementById("bName").focus(); }
async function createBoard(){
  const name=document.getElementById("bName").value.trim();
  const type=document.querySelector('input[name="btype"]:checked').value;
  const b=await rpc("wb_board_create",{p_key:KEY,p_name:name||(type==="kanban"?t("newKanban"):t("newProcess")),p_type:type});
  document.getElementById("boardOverlay").classList.remove("show");
  await loadBoards(); await selectBoard(b.id);
}
async function renameBoard(){
  if(!boardId) return; const b=boards.find(x=>x.id===boardId);
  const name=window.prompt(t("promptRename"), b?b.name:"");
  if(name===null) return;
  await rpc("wb_board_rename",{p_key:KEY,p_board:boardId,p_name:name});
  await loadBoards();
}
async function delBoard(){
  if(!boardId) return;
  if(!window.confirm(t("confirmDelBoard"))) return;
  await rpc("wb_board_delete",{p_key:KEY,p_board:boardId});
  const old=boardId; boardId=null;
  await loadBoards();
  if(boards[0]) await selectBoard(boards[0].id); else { renderEmpty(); }
}

/* ============================================================
   Globale Events / Wiring
   ============================================================ */
document.getElementById("gateGo").addEventListener("click",doGate);
document.getElementById("gateKey").addEventListener("keydown",e=>{ if(e.key==="Enter") doGate(); });

document.getElementById("boardSel").addEventListener("change",e=> selectBoard(e.target.value));
document.getElementById("newBoard").addEventListener("click",openNewBoard);
document.getElementById("renameBoard").addEventListener("click",renameBoard);
document.getElementById("delBoard").addEventListener("click",delBoard);
document.getElementById("langBtn").addEventListener("click",()=>{ LANG=LANG==="de"?"en":"de"; lsSet("wb_lang",LANG); applyI18n(); updateConnectUI(); });
document.getElementById("lockBtn").addEventListener("click",()=>{ lsDel("wb_key"); location.reload(); });

document.querySelectorAll("#procTools [data-shape]").forEach(b=>
  b.addEventListener("click",()=> addNode(b.getAttribute("data-shape"))));
document.getElementById("connectBtn").addEventListener("click",toggleConnect);
document.getElementById("delSel").addEventListener("click",()=>{
  if(!selection) return; if(selection.kind==='node') deleteNode(selection.id); else deleteEdge(selection.id);
});
document.getElementById("zIn").addEventListener("click",()=>{ view.scale=Math.min(2.5,view.scale*1.15); sceneTransform(); renderHandles(); });
document.getElementById("zOut").addEventListener("click",()=>{ view.scale=Math.max(0.05,view.scale/1.15); sceneTransform(); renderHandles(); });
document.getElementById("zFit").addEventListener("click",fitView);

// Textformatierung + Kachel-Export
["fmtBold:bold","fmtItalic:italic","fmtUnderline:underline","fmtStrike:strike","fmtUpper:upper"].forEach(s=>{
  const [id,prop]=s.split(":"); document.getElementById(id).addEventListener("click",()=>fmtToggle(prop));
});
document.getElementById("fontDec").addEventListener("click",()=>fontDelta(-2));
document.getElementById("fontInc").addEventListener("click",()=>fontDelta(2));

document.addEventListener("keydown",e=>{
  if(document.getElementById("nodeEditor").style.display==="block") return;
  if(document.querySelector(".overlay.show")) { if(e.key==="Escape"){ closeCard(); document.getElementById("boardOverlay").classList.remove("show"); } return; }
  if(e.key==="Escape"){ if(connectMode){ connectMode=false;connectSource=null;updateConnectUI(); } else clearSelection(); }
  if((e.key==="Delete"||e.key==="Backspace") && selection && boardType==="process"){
    if(document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="TEXTAREA") return;
    e.preventDefault();
    if(selection.kind==='node') deleteNode(selection.id); else deleteEdge(selection.id);
  }
});

// Card-Modal
document.getElementById("cCancel").addEventListener("click",closeCard);
document.getElementById("cSave").addEventListener("click",()=>{
  const c=state.cards[editingCardId]; if(!c){ closeCard(); return; }
  c.title=document.getElementById("cTitle").value;
  c.description=document.getElementById("cDesc").value;
  c.assignee=document.getElementById("cAssignee").value;
  c.label=document.getElementById("cLabel").value;
  closeCard(); renderKanban(); saveCard(c);
});
document.getElementById("cDelete").addEventListener("click",()=>{ const id=editingCardId; closeCard(); if(id) deleteCard(id); });

// Board-Modal
document.getElementById("bCancel").addEventListener("click",()=> document.getElementById("boardOverlay").classList.remove("show"));
document.getElementById("bCreate").addEventListener("click",createBoard);
document.querySelectorAll('#bType label').forEach(l=>{
  l.addEventListener("click",()=>{ document.querySelectorAll('#bType label').forEach(x=>x.classList.remove("sel")); l.classList.add("sel"); l.querySelector("input").checked=true; });
});

function esc(s){ return (s||"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* Formen-Panel frei verschiebbar (schwebender Container) */
(function dragShapePanel(){
  const panel=document.getElementById("shapePanel"), head=document.getElementById("shapePanelHead");
  if(!panel||!head) return;
  let drag=false,sx,sy,ox,oy;
  head.addEventListener("pointerdown",ev=>{
    drag=true; sx=ev.clientX; sy=ev.clientY;
    const r=panel.getBoundingClientRect(), pr=panel.parentElement.getBoundingClientRect();
    ox=r.left-pr.left; oy=r.top-pr.top;
    panel.style.right="auto"; panel.style.bottom="auto";
    try{ head.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  });
  head.addEventListener("pointermove",ev=>{
    if(!drag) return;
    const pr=panel.parentElement.getBoundingClientRect();
    let nx=ox+(ev.clientX-sx), ny=oy+(ev.clientY-sy);
    nx=Math.max(0,Math.min(pr.width-40,nx)); ny=Math.max(0,Math.min(pr.height-40,ny));
    panel.style.left=nx+"px"; panel.style.top=ny+"px";
  });
  head.addEventListener("pointerup",()=>{ drag=false; });
})();

/* ---------------- Start ---------------- */
applyI18n(); buildPalette(); buildShapePanel(); updateConnectUI(); updateFmtUI();
(function autostart(){
  const saved=lsGet("wb_key");
  if(saved){
    document.getElementById("gateKey").value=saved;
    doGate();
  }else{
    document.getElementById("gateKey").focus();
  }
})();
</script>
